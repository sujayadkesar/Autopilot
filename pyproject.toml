[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dfir-automation"
version = "1.0.0"
description = "Unified DFIR automation tool — GUI + CLI with pluggable forensic agents and local LLM analysis"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PySide6-Addons>=6.7",
    "python-registry>=1.4",
    "requests>=2.32",
    "rich>=13.7",
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
dfir = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "gui*"]
